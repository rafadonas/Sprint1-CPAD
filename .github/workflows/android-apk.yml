name: Android APK

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/motiva-verde.apk

      - uses: actions/upload-artifact@v4
        with:
          name: motiva-verde-apk
          path: out/motiva-verde.apk

  smoke-test:
    name: Install and launch on emulator
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: motiva-verde-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r motiva-verde.apk
            adb shell pm grant br.com.fiap.motivaverde android.permission.ACCESS_FINE_LOCATION
            adb shell monkey -p br.com.fiap.motivaverde -c android.intent.category.LAUNCHER 1
            sleep 25
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/01-mapa.png
            adb shell pidof br.com.fiap.motivaverde
            adb logcat -d -s ReactNativeJS:V AndroidRuntime:E > screenshots/logcat.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: screenshots/

  release:
    name: Publish GitHub Release
    needs: [build, smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: motiva-verde-apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" motiva-verde.apk \
            --repo "${{ github.repository }}" \
            --title "Motiva Verde ${{ github.ref_name }} — Sprint 4" \
            --notes "APK Android da versão final do Motiva Verde. Baixe o arquivo motiva-verde.apk e siga as instruções de instalação do README."
